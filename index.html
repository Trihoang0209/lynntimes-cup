<meta name="description" content="Bảng điểm trực tiếp giải pickleball Lynntimes Ryder Cup: Đội Đỏ vs Đội Xanh, 18 trận đôi.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: a Ryder Cup leaderboard band (team totals + 18-slot tug-of-war strip, centre line = 10 points) above a sticky tab rail; one column on phones, paired panels from 900px. */
:root {
  --bg: #EEF2EE;
  --surface: #FFFFFF;
  --surface-2: #F5F8F5;
  --ink: #13201A;
  --muted: #586960;
  --line: #D4DED7;
  --court: #1D6A4D;
  --court-ink: #FFFFFF;
  --court-soft: #DDEBE3;
  --red: #C3302B;
  --red-ink: #FFFFFF;
  --red-soft: #FBE8E6;
  --blue: #1F4DB3;
  --blue-ink: #FFFFFF;
  --blue-soft: #E6EDFB;
  --ball: #D8EA3A;
  --ball-ink: #1E2810;
  --warn: #8F5200;
  --warn-soft: #FFF0D6;
  --scrim: rgba(12, 22, 17, .5);
  --shadow: 0 12px 32px rgba(12, 22, 17, .18);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1512; --surface: #151F1A; --surface-2: #1A2620; --ink: #E5EDE8; --muted: #9AACA2; --line: #2B3B34;
    --court: #57B78A; --court-ink: #0B1310; --court-soft: #1C3429;
    --red: #FF7066; --red-ink: #1C0B09; --red-soft: #3B1D1B;
    --blue: #7A9EFF; --blue-ink: #0A1124; --blue-soft: #1B2643;
    --ball: #D8EA3A; --ball-ink: #1E2810; --warn: #F3B862; --warn-soft: #392A12;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1512; --surface: #151F1A; --surface-2: #1A2620; --ink: #E5EDE8; --muted: #9AACA2; --line: #2B3B34;
  --court: #57B78A; --court-ink: #0B1310; --court-soft: #1C3429;
  --red: #FF7066; --red-ink: #1C0B09; --red-soft: #3B1D1B;
  --blue: #7A9EFF; --blue-ink: #0A1124; --blue-soft: #1B2643;
  --ball: #D8EA3A; --ball-ink: #1E2810; --warn: #F3B862; --warn-soft: #392A12;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.entry input.pin-input { width: 190px; letter-spacing: .3em; }
html.sheet-open, html.sheet-open body { overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--court); outline-offset: 2px; }
.wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.sm { font-size: 13px; }
.c-red { color: var(--red); }
.c-blue { color: var(--blue); }
.mono { font-variant-numeric: tabular-nums; }
.warn-text { color: var(--warn); font-weight: 600; }
p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Leaderboard band */
.board { background: var(--surface); border-bottom: 1px solid var(--line); }
.board-in { padding-block: 18px 16px; display: grid; gap: 12px; }
.board-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.title { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(34px, 7vw, 52px); line-height: .92; letter-spacing: .01em; text-transform: uppercase; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.live { color: var(--court); }
.pill.live .dot { background: var(--court); box-shadow: 0 0 0 3px var(--court-soft); }
.pill.local .dot { background: var(--warn); }
.score-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.team-side { display: grid; gap: 2px; min-width: 0; }
.team-side.blue { text-align: right; justify-items: end; }
.team-name { font-family: var(--f-display); font-weight: 900; font-size: clamp(24px, 5vw, 34px); line-height: 1; text-transform: uppercase; letter-spacing: .03em; }
.team-side.red .team-name { color: var(--red); }
.team-side.blue .team-name { color: var(--blue); }
.team-cap { font-size: 13px; color: var(--muted); }
.big-score { display: flex; align-items: baseline; gap: 10px; font-family: var(--f-display); font-weight: 900; font-size: clamp(60px, 15vw, 104px); line-height: .85; font-variant-numeric: tabular-nums; }
.big-score .r { color: var(--red); }
.big-score .b { color: var(--blue); }
.big-score .sep { color: var(--muted); font-weight: 700; font-size: .6em; }
.strip-wrap { display: grid; gap: 6px; }
.strip { position: relative; display: grid; grid-template-columns: repeat(18, 1fr); gap: 3px; }
.strip::after { content: ""; position: absolute; left: 50%; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.strip .cell { height: 16px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
.strip .cell.red { background: var(--red); border-color: var(--red); }
.strip .cell.blue { background: var(--blue); border-color: var(--blue); }
.strip-legend { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.strip-legend b { font-weight: 700; }
.status-line { font-size: 14px; }

/* Tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs-in { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 8px; }
.tabs-in::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); text-decoration: none; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { background: var(--court); color: var(--court-ink); }
@media (max-width: 520px) {
  .tabs-in { gap: 2px; }
  .tab { flex: 1 1 auto; padding: 8px 6px; font-size: 13px; text-align: center; white-space: nowrap; }
  th, td { padding: 8px 6px; }
}

/* Content */
main.wrap { padding-block: 16px 32px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.05; text-transform: uppercase; letter-spacing: .03em; }
.card h3 { margin: 4px 0 0; font-size: 15px; font-weight: 700; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); font-size: 14px; }
.banner.subtle { background: var(--surface-2); color: var(--muted); }
.banner.warn { color: var(--warn); }
.eta { font-size: 13px; color: var(--muted); }
.eta b { color: var(--ink); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; line-height: 1.2; cursor: pointer; text-decoration: none; text-align: center; }
.btn:hover { border-color: var(--court); }
.btn.primary { background: var(--court); border-color: var(--court); color: var(--court-ink); }
.btn.red { background: var(--red); border-color: var(--red); color: var(--red-ink); }
.btn.blue { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.btn.danger { background: transparent; border-color: var(--red); color: var(--red); }
.btn.sm { min-height: 34px; padding: 5px 11px; font-size: 13px; }
.btn.big { min-height: 64px; font-size: 17px; width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* Courts */
.courts { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .courts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.court { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface-2); display: grid; gap: 10px; align-content: start; min-width: 0; }
.court.is-live { border-color: var(--court); box-shadow: 0 0 0 2px var(--court-soft); background: var(--surface); }
.court-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.court-label { font-family: var(--f-display); font-weight: 900; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; }
.sug-k { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.vs .side { min-width: 0; display: grid; gap: 2px; }
.vs .side.blue { text-align: right; justify-items: end; }
.pair { font-weight: 700; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.side.red .pair { color: var(--red); }
.side.blue .pair { color: var(--blue); }
.vs-x { font-size: 12px; color: var(--muted); font-weight: 600; }
.mini-score { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-display); font-weight: 900; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
.court-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; font-size: 13px; color: var(--muted); }
.court-foot b { color: var(--ink); font-size: 15px; }
.to-banner { padding: 8px 10px; border-radius: 8px; font-weight: 700; font-size: 14px; background: var(--ball); color: var(--ball-ink); }
.ball { width: 15px; height: 15px; flex: 0 0 auto; vertical-align: -2px; }
.mini-score .ball { width: 18px; height: 18px; }
.ball-f { fill: var(--ball); stroke: var(--ball-ink); stroke-width: .9; }
.ball-h { fill: var(--ball-ink); opacity: .45; }

/* Tags */
.tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.type { background: var(--court-soft); border-color: transparent; color: var(--court); }
.tag.live { background: var(--ball); border-color: transparent; color: var(--ball-ink); }
.tag.done { background: transparent; }
.tag.feat { background: var(--ink); border-color: transparent; color: var(--surface); }
.lv { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; font-family: var(--f-display); font-weight: 900; font-size: 13px; line-height: 1; flex: 0 0 auto; }
.lv-A { background: var(--ink); color: var(--surface); }
.lv-B { background: var(--court-soft); color: var(--court); }
.lv-C { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

/* Queue & recent lists */
.queue, .recent { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.qrow { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.qrow:hover { border-color: var(--court); }
.q-no { font-family: var(--f-display); font-weight: 800; font-size: 18px; color: var(--muted); min-width: 2.4ch; }
.q-main { font-size: 14px; overflow-wrap: anywhere; }
.q-ready { font-size: 12px; font-weight: 700; color: var(--court); white-space: nowrap; }
.q-wait { font-size: 12px; font-weight: 600; color: var(--warn); text-align: right; }
.copybox { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; resize: vertical; }

/* Match cards */
.round { display: grid; gap: 8px; }
.round + .round { padding-top: 6px; border-top: 1px solid var(--line); }
.round-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.round-no { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; }
.round-grid { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .round-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.mcard { width: 100%; display: grid; gap: 4px; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-align: left; cursor: pointer; min-width: 0; }
.mcard:hover { border-color: var(--court); }
.mcard.is-live { border-color: var(--court); box-shadow: 0 0 0 2px var(--court-soft); }
.mcard.win-red { background: var(--red-soft); }
.mcard.win-blue { background: var(--blue-soft); }
.mtop { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 2px; }
.mno { font-family: var(--f-display); font-weight: 800; font-size: 16px; text-transform: uppercase; margin-right: 2px; }
.mline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mline .who { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; overflow-wrap: anywhere; min-width: 0; }
.mline.red .who { color: var(--red); }
.mline.blue .who { color: var(--blue); }
.mscore { font-family: var(--f-display); font-weight: 900; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.mscore.lost { color: var(--muted); }
.mscore.empty { color: var(--line); }
.mfoot { font-size: 12px; color: var(--muted); }

/* Stats */
.award { display: grid; gap: 3px; padding: 14px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--line); min-width: 0; }
.award .k { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.award .v { font-family: var(--f-display); font-weight: 900; font-size: 28px; line-height: 1.05; overflow-wrap: anywhere; }
.award .s { font-size: 13px; color: var(--muted); }
.award.hero .v { font-size: clamp(36px, 8vw, 54px); }
.awards4 { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (min-width: 900px) { .awards4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.champ-name { font-size: clamp(40px, 9vw, 64px) !important; }
.card.champ.red { background: var(--red-soft); border-color: var(--red); }
.card.champ.blue { background: var(--blue-soft); border-color: var(--blue); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 13px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--court); color: var(--court-ink); }
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td.l, th.l { text-align: left; }
td .nm { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
tr.unplayed td { color: var(--muted); }
.hls { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 600px) { .hls { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 980px) { .hls { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.hl { display: grid; gap: 3px; padding: 12px; border-radius: 8px; border: 1px solid var(--line); min-width: 0; }
.hl .k { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.hl .v { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.hl .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.chart-wrap .grid { stroke: var(--line); stroke-width: 1; }
.chart-wrap .axis { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart-wrap .goal { stroke: var(--ink); stroke-width: 1.2; stroke-dasharray: 5 4; opacity: .55; }
.chart-wrap .goal-t { fill: var(--ink); font-size: 11px; font-weight: 600; font-family: var(--f-body); }
.chart-wrap .ln { fill: none; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.chart-wrap .ln.red { stroke: var(--red); }
.chart-wrap .ln.blue { stroke: var(--blue); }
.chart-wrap .dt.red { fill: var(--red); }
.chart-wrap .dt.blue { fill: var(--blue); }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; background: currentColor; }

/* Roster */
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.plist details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.plist summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 10px 12px; cursor: pointer; list-style: none; }
.plist summary::-webkit-details-marker { display: none; }
.plist summary::after { content: "+"; margin-left: auto; font-weight: 700; color: var(--muted); }
.plist details[open] summary::after { content: "–"; }
.pname { font-weight: 700; }
.prec { font-size: 13px; color: var(--muted); }
.pm { margin: 0; padding: 0 12px 12px 12px; list-style: none; display: grid; gap: 6px; }
.pm li { font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; padding-top: 6px; border-top: 1px solid var(--line); }
.pm-no { font-family: var(--f-display); font-weight: 800; font-size: 15px; color: var(--muted); }
.res { font-weight: 700; }
.res.w { color: var(--court); }
.res.l { color: var(--muted); }
.res.live { color: var(--warn); }

/* Rules */
.rules ul, .rules ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 72ch; }
.rules .facts b { font-family: var(--f-display); font-size: 18px; }
.timeline b { font-variant-numeric: tabular-nums; }

/* Sheet */
.sheet-backdrop { position: fixed; inset: 0; z-index: 40; background: var(--scrim); }

/* ---------- persistence: Vercel API (api/state) + optional single-device mode ---------- */
var API = 'api/state';
var rev = -1, pollTimer = 0, failures = 0, everLive = false;
function storedPin() { try { return localStorage.getItem(LS_PIN) || ''; } catch (e) { return ''; } }
function savePin(p) { try { if (p) localStorage.setItem(LS_PIN, p); else localStorage.removeItem(LS_PIN); } catch (e) {} }
function hasLive() { return M.some(function (m) { var s = getM(m.id); return !!(s && s.status === 'live'); }); }
function commit(id, next, opts) {
  if (!canEdit()) return;
  opts = opts || {};

    var stack = S.undo[id] || (S.undo[id] = []);
    var prev = getM(id); stack.push(prev ? Logic.copy(prev) : null);
    if (stack.length > 100) stack.shift();

}
function queue(id, data, delay) {

  q.data = data; q.pending = true;

}
function post(body, pin) {
  return fetch(API, {
    method: 'POST', cache: 'no-store',
    headers: { 'Content-Type': 'application/json', 'x-score-pin': pin == null ? (S.pin || '') : pin },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var e = new Error(j.error || 'http_' + r.status); e.status = r.status; throw e; }
      return j;
    });
  });
}
function flush(id) {

  q.pending = false; q.inflight = true;
  var p;
  if (S.mode === 'local') {
    if (data) S.remote[id] = data; else delete S.remote[id];
    saveLocal(); p = Promise.resolve({ rev: 0 });
  } else {
    p = post({ op: 'match', id: id, data: data });
  }
  p.then(function (j) {
    q.inflight = false; q.tries = 0; q.rev = num(j && j.rev);
    if (S.note.indexOf('Chưa lưu') === 0) S.note = '';
    if (q.pending) { flush(id); return; }
    if (S.mode === 'local') { delete S.local[id]; render(); return; }
    schedulePoll(250);
  }, function (e) {
    q.inflight = false;
    var st = e && e.status;
    if (st === 401) { q.pending = false; delete S.local[id]; onBadPin(); render(); return; }
    if (st === 400 || st === 413) { q.pending = false; delete S.local[id]; S.note = 'Dữ liệu Trận ' + BYID[id].no + ' không hợp lệ nên chưa lưu.'; render(); return; }
    q.tries++;
    if (!q.pending) { q.data = data; q.pending = true; }
    S.note = 'Chưa lưu được Trận ' + BYID[id].no + ', đang thử lại…';
    render();
    clearTimeout(q.timer);
    q.timer = setTimeout(function () { flush(id); }, Math.min(15000, 1000 * Math.pow(2, q.tries)));
  });
}
function onBadPin() { S.pin = ''; savePin(''); S.canWrite = false; S.note = 'Mã PIN không đúng hoặc đã được đổi. Nhập lại PIN để ghi điểm.'; }
function writeMeta(obj) {

  S.meta = obj; render();
  if (S.mode === 'local') { saveLocal(); return; }
  post({ op: 'meta', data: obj }).then(function () { schedulePoll(250); }, function (e) {
    if (e && e.status === 401) onBadPin(); else S.note = 'Chưa lưu được trạng thái giải. Kiểm tra mạng rồi thử lại.';
    render();
  });
}
function wipeAll() {
  if (!canEdit()) return;
  S.undo = {};
  M.forEach(function (m) { if (wq[m.id]) { clearTimeout(wq[m.id].timer); wq[m.id].pending = false; } });
  if (S.mode === 'local') { S.remote = {}; S.local = {}; S.meta = {}; saveLocal(); render(); toast('Đã xóa toàn bộ tỷ số'); return; }
  post({ op: 'wipe' }).then(function () {
    S.local = {}; S.remote = {}; S.meta = {}; toast('Đã xóa toàn bộ tỷ số'); render(); schedulePoll(200);
  }, function (e) {
    if (e && e.status === 401) onBadPin(); else S.note = 'Chưa xóa được. Kiểm tra mạng rồi thử lại.';
    render();
  });
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ matches: S.remote, meta: S.meta })); }
  catch (e) { S.note = 'Trình duyệt chặn lưu dữ liệu, tỷ số sẽ mất khi tải lại trang.'; }
}
function enterLocal() {
  stopPolling();
  S.mode = 'local'; S.canWrite = true; S.note = ''; S.local = {};
  try { localStorage.setItem(LS_MODE, 'local'); } catch (e) {}
  try { var raw = localStorage.getItem(LS_KEY); var o = raw ? JSON.parse(raw) : {}; S.remote = o.matches || {}; S.meta = o.meta || {}; }
  catch (e) { S.remote = {}; S.meta = {}; }

}
function startOffline(reason) {

  try { pref = localStorage.getItem(LS_MODE); } catch (e) {}

}
function stopPolling() { clearTimeout(pollTimer); pollTimer = 0; }
function schedulePoll(ms) {

}
function nextInterval() { return hasLive() ? 4000 : 15000; }
function applyRemote(j) {
  var next = {}, ms = j.matches || {};
  Object.keys(ms).forEach(function (id) { if (BYID[id] && ms[id] && typeof ms[id] === 'object') next[id] = ms[id]; });
  S.remote = next; S.meta = (j.meta && typeof j.meta === 'object') ? j.meta : {}; rev = num(j.rev);
  Object.keys(S.local).forEach(function (id) { var q = wq[id]; if (!q || (!q.pending && !q.inflight && rev >= q.rev)) delete S.local[id]; });
}
function poll() {
  pollTimer = 0;

  if (document.hidden) return;
  fetch(API + '?since=' + rev, { cache: 'no-store' }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var e = new Error(j.error || 'http_' + r.status); e.status = r.status; throw e; }
      return j;
    });
  }).then(function (j) {
    if (typeof j.rev !== 'number') { var e = new Error('bad_response'); e.status = 404; throw e; }

    if (S.note.indexOf('Mất kết nối') === 0) { S.note = ''; changed = true; }
    if (!j.unchanged) { applyRemote(j); changed = true; }

    failures++;

    if (!everLive && (st === 404 || st === 503 || st === 405 || failures >= 2)) { startOffline(st === 503 ? 'not_configured' : 'no_api'); return; }

    schedulePoll(Math.min(30000, 2000 * failures));

}

function playerTable(st) {

function chartHtml(st) {
  if (!st.finals.length) return '<p class="muted">Biểu đồ hiện khi có trận đầu tiên kết thúc.</p>';
  var W = 640, H = 250, L = 34, R = 16, TP = 22, B = 40, n = st.finals.length;
  var maxY = Math.max(WIN, st.red, st.blue);
  function x(i) { return L + (W - L - R) * (i / Math.max(n, 1)); }
  function y(v) { return TP + (H - TP - B) * (1 - v / maxY); }
  var r = 0, b = 0, pr = [[0, 0]], pb = [[0, 0]];
  st.finals.forEach(function (f, i) { if (f.w === 'red') r++; else b++; pr.push([i + 1, r]); pb.push([i + 1, b]); });
  function path(pts) { return pts.map(function (p, i) { return (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1); }).join(' '); }
  var ticks = [0, 5, 10]; if (maxY > 10) ticks.push(maxY);
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Điểm cộng dồn của hai đội theo thứ tự trận kết thúc">';
  ticks.forEach(function (v) { svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text class="axis" x="' + (L - 8) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + v + '</text>'; });
  svg += '<line class="goal" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(WIN).toFixed(1) + '" y2="' + y(WIN).toFixed(1) + '"/><text class="goal-t" x="' + (W - R) + '" y="' + (y(WIN) - 6).toFixed(1) + '" text-anchor="end">10 điểm = vô địch</text>';
  svg += '<path class="ln red" d="' + path(pr) + '"/><path class="ln blue" d="' + path(pb) + '"/>';
  pr.slice(1).forEach(function (p) { svg += '<circle class="dt red" cx="' + x(p[0]).toFixed(1) + '" cy="' + y(p[1]).toFixed(1) + '" r="3.6"/>'; });
  pb.slice(1).forEach(function (p) { svg += '<circle class="dt blue" cx="' + x(p[0]).toFixed(1) + '" cy="' + y(p[1]).toFixed(1) + '" r="3.6"/>'; });
  st.finals.forEach(function (f, i) { svg += '<text class="axis" x="' + x(i + 1).toFixed(1) + '" y="' + (H - B + 16) + '" text-anchor="middle">' + f.m.no + '</text>'; });
  svg += '<text class="axis" x="' + L + '" y="' + (H - 6) + '">Số thứ tự trận, xếp theo lúc kết thúc</text></svg>';
  return '<div class="legend"><span class="c-red">Đỏ</span><span class="c-blue">Xanh</span></div><div class="chart-wrap">' + svg + '</div>';
}

function sheetFinal(m, s) {

  var d = (!s.direct && num(s.startedAt) && num(s.endedAt) > num(s.startedAt)) ? dur(num(s.endedAt) - num(s.startedAt)) : '';

  function rs(t) {

function renderSheet() {
  var sh = $('#sheet'), bd = $('#sheetBackdrop');
  if (!S.sheet || (!BYID[S.sheet] && S.sheet !== 'pin')) {
    if (!sh.hidden) { sh.hidden = true; bd.hidden = true; sh.innerHTML = ''; document.documentElement.classList.remove('sheet-open'); }
    return;
  }
  if (inputFocused(sh)) return;
  if (S.sheet === 'pin') {
    var wh = sh.hidden;
    sh.hidden = false; bd.hidden = false; document.documentElement.classList.add('sheet-open');
    sh.innerHTML = pinSheet();
    if (wh) { var pi = $('#pinInput'); if (pi) { try { pi.focus({ preventScroll: true }); } catch (e) {} } }
    return;
  }
  var m = BYID[S.sheet], s = getM(m.id), wasHidden = sh.hidden, top = sh.scrollTop;
  sh.hidden = false; bd.hidden = false; document.documentElement.classList.add('sheet-open');
  sh.innerHTML = sheetHead(m) + (!s ? sheetStart(m) : s.status === 'live' ? sheetLive(m, s) : sheetFinal(m, s));
  sh.scrollTop = top;
  if (wasHidden) { var c = sh.querySelector('[data-act="close"]'); if (c) { try { c.focus({ preventScroll: true }); } catch (e) {} } }
}

/* ---------- events ---------- */
function onClick(e) {
  if (e.target && e.target.id === 'sheetBackdrop') { closeSheet(); return; }
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b || b.disabled) return;
  var act = b.getAttribute('data-act'), id = b.getAttribute('data-id') || (BYID[S.sheet] ? S.sheet : null), t = b.getAttribute('data-team'), s;
  switch (act) {
    case 'open': openSheet(id, b.getAttribute('data-c') ? +b.getAttribute('data-c') : null); break;
    case 'close': closeSheet(); break;
    case 'set-court': S.ui.court = +b.getAttribute('data-c'); render(); break;
    case 'set-serve': S.ui.serve = t; render(); break;
    case 'start': if (!getM(id)) commit(id, newLive(S.ui.court || defaultCourt(BYID[id]), S.ui.serve || 'red')); break;
    case 'point': s = liveState(id); if (s) commit(id, Logic.afterPoint(s)); break;
    case 'fault': s = liveState(id); if (s) commit(id, Logic.afterFault(s)); break;
    case 'adj': s = liveState(id); if (s) { s = Logic.copy(s); s[t] = Math.max(0, num(s[t]) + (+b.getAttribute('data-d'))); commit(id, s); } break;
    case 'swap-serve': s = liveState(id); if (s) { s = Logic.copy(s); s.serve = other(s.serve); commit(id, s); } break;
    case 'swap-server': s = liveState(id); if (s) { s = Logic.copy(s); s.server = num(s.server) === 1 ? 2 : 1; commit(id, s); } break;
    case 'undo': { var st = S.undo[id]; if (st && st.length) { var prev = st.pop(); commit(id, prev, { noUndo: true }); } break; }
    case 'chal':
      s = liveState(id);
      if (s && Logic.chalLeft(s, t)) {
        s = Logic.copy(s); s.chal = s.chal || {}; var c = s.chal[t] || (s.chal[t] = { used: 0, won: 0 });
        c.used = num(c.used) + 1; if (b.getAttribute('data-res') === 'won') c.won = num(c.won) + 1;
        commit(id, s);
        toast(TEAM[t].label + ': challenge ' + (b.getAttribute('data-res') === 'won' ? 'đúng, giữ quyền' : 'sai, mất quyền'));
      }
      break;
    case 'timeout': s = liveState(id); if (s && !num(s.to && s.to[t])) { s = Logic.copy(s); s.to = s.to || {}; s.to[t] = Date.now(); commit(id, s); } break;
    case 'end': s = liveState(id); if (s) { if (Logic.isWin(s.red, s.blue)) finish(id, false); else { S.ui.confirmEnd = true; render(); } } break;
    case 'end-force': finish(id, true); break;
    case 'end-cancel': S.ui.confirmEnd = false; render(); break;
    case 'reopen':
      s = getM(id);
      if (s && s.status === 'final') {
        s = Logic.copy(s); s.status = 'live'; s.endedAt = 0; s.forced = false;
        if (!num(s.startedAt)) s.startedAt = Date.now();
        if (s.serve !== 'red' && s.serve !== 'blue') s.serve = 'red';
        if (num(s.server) !== 1 && num(s.server) !== 2) s.server = 1;
        s.direct = false; s.chal = s.chal || { red: { used: 0, won: 0 }, blue: { used: 0, won: 0 } }; s.to = s.to || { red: 0, blue: 0 };
        commit(id, s);
      }
      break;
    case 'reset-ask': S.ui.confirmReset = true; render(); break;
    case 'reset-cancel': S.ui.confirmReset = false; render(); break;
    case 'reset': S.ui.confirmReset = false; S.ui.confirmEnd = false; commit(id, null); break;
    case 'entry-force': saveEntry(id, true); break;
    case 'copy': copySummary(); break;
    case 'filter': S.filter = b.getAttribute('data-f'); render(); break;
    case 'local-mode': enterLocal(); break;
    case 'leave-local':
      try { localStorage.removeItem(LS_MODE); } catch (e) {}
      S.mode = 'connecting'; S.remote = {}; S.local = {}; S.meta = {}; S.undo = {}; S.note = ''; failures = 0; everLive = false; rev = -1;
      render(); poll(); break;
    case 'retry': S.mode = 'connecting'; S.note = ''; failures = 0; everLive = false; render(); poll(); break;
    case 'pin-open': S.sheet = 'pin'; S.ui = { pinErr: '', pinBusy: false }; render(); break;
    case 'pin-forget': S.pin = ''; savePin(''); S.canWrite = !S.pinRequired; render(); toast('Đã khóa ghi điểm trên máy này'); break;
    case 'event-ask': S.page.confirmEvent = true; render(); break;
    case 'event-cancel': S.page.confirmEvent = false; render(); break;
    case 'event-end': S.page.confirmEvent = false; writeMeta({ ended: true, endedAt: Date.now() }); break;
    case 'event-reopen': writeMeta({ ended: false, endedAt: 0 }); break;
    case 'wipe-ask': S.page.confirmWipe = true; render(); break;
    case 'wipe-cancel': S.page.confirmWipe = false; render(); break;
    case 'wipe': S.page.confirmWipe = false; wipeAll(); break;
  }
}
function onSubmit(e) {
  var f = e.target;
  if (!f || !f.matches) return;
  if (f.matches('form[data-form="pin"]')) {
    e.preventDefault();
    var inp = $('#pinInput'), v = inp ? inp.value.trim() : '';
    if (!v) { S.ui.pinErr = 'Nhập PIN trước khi mở khóa.'; blurAndRender(); return; }
    S.ui.pinBusy = true; S.ui.pinErr = ''; blurAndRender();
    post({ op: 'check' }, v).then(function () {
      S.ui.pinBusy = false; S.pin = v; savePin(v); S.canWrite = true;
      if (S.note.indexOf('Mã PIN') === 0) S.note = '';
      closeSheet(); toast('Đã mở khóa ghi điểm trên máy này');
    }, function (err) {
      S.ui.pinBusy = false;
      S.ui.pinErr = err && err.status === 401 ? 'PIN không đúng.' : err && err.status === 503 ? 'Máy chủ chưa gắn database nên chưa kiểm tra được PIN.' : 'Mất mạng, chưa kiểm tra được PIN.';
      render();
    });
    return;
  }
  if (!f.matches('form[data-form="entry"]')) return;
  e.preventDefault();
  saveEntry(f.getAttribute('data-id'), false);
}
function onInput(e) {
  var t = e.target;
  if (t && (t.id === 'eRed' || t.id === 'eBlue')) {
    t.value = t.value.replace(/[^0-9]/g, '');
    var er = $('#eRed'), eb = $('#eBlue');
    S.ui.entry = { red: er ? er.value : '', blue: eb ? eb.value : '' };
  }
}
function onFocusOut(e) {
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) setTimeout(function () { if (!inputFocused()) render(); }, 0);
}
function onToggle(e) {
  var d = e.target;
  if (d && d.matches && d.matches('details[data-p]')) { var p = d.getAttribute('data-p'); if (d.open) S.open[p] = 1; else delete S.open[p]; }
}
function tabFromHash() {
  var h = (location.hash || '').replace('#', '');
  return TABS.some(function (t) { return t[0] === h; }) ? h : 'tong-quan';
}
function tick() {
  var now = Date.now();
  document.querySelectorAll('[data-since]').forEach(function (el) { var v = +el.getAttribute('data-since'); if (v) el.textContent = dur(now - v); });
  document.querySelectorAll('[data-to-at]').forEach(function (el) {
    var left = 60000 - (now - (+el.getAttribute('data-to-at')));
    if (el.getAttribute('data-fmt') === 's') el.textContent = String(Math.max(0, Math.ceil(left / 1000)));
    else el.textContent = left > 0 ? 'còn ' + Math.ceil(left / 1000) + ' giây' : 'đã dùng';
  });
  document.querySelectorAll('[data-to-wrap]').forEach(function (el) { if (now - (+el.getAttribute('data-to-wrap')) >= 60000) el.hidden = true; });
  if (++tickN % 30 === 0 && !inputFocused()) render();
}

function init() {
  S.tab = tabFromHash();
  S.pin = storedPin();
  render();
  window.addEventListener('hashchange', function () {
    S.tab = tabFromHash(); render();
    var tabs = $('#tabs'); if (tabs && window.scrollY > tabs.offsetTop) window.scrollTo(0, tabs.offsetTop);
  });
  document.addEventListener('click', onClick);
  document.addEventListener('submit', onSubmit);
  document.addEventListener('input', onInput);
  document.addEventListener('focusout', onFocusOut);
  document.addEventListener('toggle', onToggle, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) closeSheet(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && (S.mode === 'live' || S.mode === 'connecting')) schedulePoll(60); });
  setInterval(tick, 1000);
  if (location.protocol === 'file:') { startOffline('file'); return; }
  poll();
}
init();
})();
</script>
</body>
